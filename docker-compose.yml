services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduquest
      POSTGRES_PASSWORD: eduquest
      POSTGRES_DB: eduquest
    ports:
      - '5432:5432'
    volumes:
      - eduquest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduquest -d eduquest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduquest-postgres:
